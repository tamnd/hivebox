# Hex strings such as trace and span ids are not words.
[default]
extend-ignore-re = ["\\b[0-9a-f]{16,}\\b"]

# Words typos does not know and that are not mistakes. Each one is a real name in this domain.
[default.extend-words]
# Linux Data Access MONitor, the kernel's memory access sampler.
DAMON = "DAMON"
# Free page reporting, the virtio-balloon feature.
FPR = "FPR"
# The open(2) flag for write only.
WRONLY = "WRONLY"
# The rtnetlink attribute for a route's output interface, RTA_OIF.
OIF = "OIF"
# The ancillary data length in struct msghdr, msg_controllen.
controllen = "controllen"
