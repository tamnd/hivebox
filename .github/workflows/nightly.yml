# The slow tier. Everything here is too slow or too noisy to gate a merge, and all of it is the
# kind of check that finds a problem days before a user would.
#
# At M0 the list is short, because most of what belongs here needs a node agent that starts cells.
# It grows with the milestones, and what is missing is named in the last job rather than left
# implicit, so that the gap is visible.

name: nightly

on:
  schedule:
    # 03:00 UTC. Late enough that a day's commits are in, early enough that the results are
    # waiting in the morning.
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  miri:
    name: miri
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install nightly with miri
        run: rustup toolchain install nightly --profile minimal --component miri
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: miri
      # Library unit tests of the crates Miri can run. The rest call what Miri does not emulate
      # (unshare, open_tree, posix_spawn, vsock and unix sockets, userfaultfd, fsync on a pipe) or
      # take longer than ten minutes under it (hive-keeper, hive-nectar, hive-scout). hive-auth is
      # out because biscuit gives a check one millisecond, which no check makes under Miri.
      # Isolation is off so that tests may read the clock and the scratch directory.
      - run: >-
          cargo +nightly miri test --lib
          -p hive-proto -p hive-types -p hive-gate -p hive-pollen -p hive-waggle -p hivectl
          -p hive-cell-qemu -p hive-cell-wasm -p hive-cell-plugin
        env:
          MIRIFLAGS: -Zmiri-strict-provenance -Zmiri-disable-isolation

  sanitizers:
    name: ${{ matrix.san }} sanitizer
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        san: [address, thread]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install nightly
        run: rustup toolchain install nightly --profile minimal --component rust-src
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: san-${{ matrix.san }}
      # The thread sanitizer is here for the node agent's cell table and the page server, which are
      # shared across threads by design and where a data race is a cell answering for another. It
      # runs the library tests only. The integration tests fork processes, hand tokio's registrations
      # to the kernel through epoll and run wasmtime's fibers and signal handlers, none of which
      # the sanitizer can follow, and the false reports there would bury a real one.
      - name: cargo test under the sanitizer
        env:
          RUSTFLAGS: -Zsanitizer=${{ matrix.san }}
          RUSTDOCFLAGS: -Zsanitizer=${{ matrix.san }}
        run: >-
          cargo +nightly test --workspace --all-features -Zbuild-std --target x86_64-unknown-linux-gnu
          --no-fail-fast ${{ matrix.san == 'thread' && '--lib' || '' }}

  advisories:
    name: advisories
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-deny
      # The per-commit job checks the advisory database as it stood when the commit landed. This
      # one catches an advisory published afterwards, which is the case that matters for something
      # already deployed.
      - run: cargo deny --all-features check advisories bans

  # The M1 exit criterion is 10,000 seeds clean, and seeds 1 to 10,000 are those. A second 10,000
  # starting from the day's number times 10,000 adds seeds no night has run before. hive-sim is one
  # thread, so the 20,000 go in eight shards over the runner's cores. A seed that breaks an
  # invariant prints its number, and `hive-sim --seed N --trace` replays it.
  simulation:
    name: 20K simulation seeds
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: sim
      - run: cargo build --release --locked -p hive-sim --bin hive-sim
      - name: the seeds
        run: |
          day=$(( $(date -u +%s) / 86400 * 10000 ))
          rc=0
          pids=()
          for from in 1 2501 5001 7501 $day $(( day + 2500 )) $(( day + 5000 )) $(( day + 7500 )); do
            target/release/hive-sim --seeds 2500 --from "$from" > "sim-$from.txt" &
            pids+=($!)
          done
          for p in "${pids[@]}"; do wait "$p" || rc=1; done
          cat sim-*.txt
          exit $rc

  # libFuzzer on what a hostile guest, a torn disk or a bad image can hand the node: the guest frame
  # codec, the handshake and the node end of the channel, WAL replay, the blobs nectar stores and
  # the tar to EROFS writer. The targets are in fuzz/. Each runs ten minutes, six at once on the
  # runner's four cores, and the corpus carries over from night to night so each night starts where
  # the last one stopped. An input that fails is uploaded, and `cargo +nightly fuzz run -a TARGET
  # FILE` replays it.
  fuzz:
    name: fuzzing
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install nightly
        run: rustup toolchain install nightly --profile minimal
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-fuzz
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: fuzz
          workspaces: fuzz
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-
      # The cargo-fuzz this installs is a musl build, which would build the targets for musl too,
      # where the address sanitizer cannot run. So the target is named.
      - run: cargo +nightly fuzz build -a --target x86_64-unknown-linux-gnu
        working-directory: fuzz
      - name: the targets
        working-directory: fuzz
        run: |
          declare -A pid
          for t in frame handshake channel wal blobs erofs; do
            cargo +nightly fuzz run -a --target x86_64-unknown-linux-gnu "$t" -- -max_total_time=600 -rss_limit_mb=2048 -timeout=30 > "$t.log" 2>&1 &
            pid[$t]=$!
          done
          # A clean target shows its last lines. One that failed shows its whole log but the
          # progress lines, so the panic and the input that caused it are both there.
          rc=0
          for t in frame handshake channel wal blobs erofs; do
            if wait "${pid[$t]}"; then
              echo "$t, clean, $(ls "corpus/$t" | wc -l) inputs in the corpus:"
              tail -n 3 "$t.log"
            else
              rc=1
              echo "$t failed:"
              grep -v -E '^#[0-9]+\s+(INITED|NEW|REDUCE|pulse)' "$t.log"
            fi
          done
          exit $rc
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts

  # Named so the gap is visible rather than implicit. Each line becomes a real job at the milestone
  # that makes it possible, per spec/13_observability_testing_bench.md and spec/14_roadmap.md.
  planned:
    name: what belongs here and does not exist yet
    runs-on: ubuntu-24.04
    steps:
      - name: the list
        run: |
          cat <<'LIST'
          the driver conformance suite on a KVM capable self-hosted runner         M0
          SWE-bench Verified gold patches through the container tier               M0
          E2B compatibility suite, slime SWE unmodified                            M1
          the escape corpus against every tier and network profile                 M3
          LIST
