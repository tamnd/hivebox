[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.0.38"
edition = "2024"
# The floor is raised deliberately, in a commit, and the msrv job in CI holds us to it. 1.88 is the
# first release with let chains on edition 2024, and that is the only reason it is not 1.85.
rust-version = "1.88.0"
license = "Apache-2.0"
repository = "https://github.com/tamnd/hivebox"
homepage = "https://github.com/tamnd/hivebox"
authors = ["tamnd <tamnd87@gmail.com>"]
keywords = ["sandbox", "microvm", "firecracker", "reinforcement-learning", "agents"]
categories = ["virtualization", "development-tools", "network-programming"]
readme = "README.md"
# Nothing is published until the public API is worth depending on. The names are checked on
# crates.io before this line goes away, because several hive-* names are already taken there.
publish = false

# One version for the whole workspace, bumped together. Internal crates are pinned exactly so that
# a partial publish can never produce a mixed version build.
[workspace.dependencies]
hive-types = { version = "=0.0.38", path = "crates/hive-types" }
hive-proto = { version = "=0.0.38", path = "crates/hive-proto" }
hive-rt = { version = "=0.0.38", path = "crates/hive-rt" }
hive-telemetry = { version = "=0.0.38", path = "crates/hive-telemetry" }
hive-auth = { version = "=0.0.38", path = "crates/hive-auth" }
hive-cell = { version = "=0.0.38", path = "crates/hive-cell" }
hive-nectar = { version = "=0.0.38", path = "crates/hive-nectar" }
hive-drone = { version = "=0.0.38", path = "crates/hive-drone" }
hive-cell-wasm = { version = "=0.0.38", path = "crates/hive-cell-wasm" }
hive-cell-proc = { version = "=0.0.38", path = "crates/hive-cell-proc" }
hive-cell-oci = { version = "=0.0.38", path = "crates/hive-cell-oci" }
hive-cell-fc = { version = "=0.0.38", path = "crates/hive-cell-fc" }
hive-cell-ch = { version = "=0.0.38", path = "crates/hive-cell-ch" }
hive-cell-qemu = { version = "=0.0.38", path = "crates/hive-cell-qemu" }
hive-cell-plugin = { version = "=0.0.38", path = "crates/hive-cell-plugin" }
hive-uffd = { version = "=0.0.38", path = "crates/hive-uffd" }
hive-snap = { version = "=0.0.38", path = "crates/hive-snap" }
hive-blockd = { version = "=0.0.38", path = "crates/hive-blockd" }
hive-guard = { version = "=0.0.38", path = "crates/hive-guard" }
hive-imaged = { version = "=0.0.38", path = "crates/hive-imaged" }
hive-comb = { version = "=0.0.38", path = "crates/hive-comb" }
hive-waggle = { version = "=0.0.38", path = "crates/hive-waggle" }
hive-scout = { version = "=0.0.38", path = "crates/hive-scout" }
hive-keeper = { version = "=0.0.38", path = "crates/hive-keeper" }
hive-gate = { version = "=0.0.38", path = "crates/hive-gate" }
hive-sdk = { version = "=0.0.38", path = "crates/hive-sdk" }
hive-pollen = { version = "=0.0.38", path = "crates/hive-pollen" }
hive-sim = { version = "=0.0.38", path = "crates/hive-sim" }
hivectl = { version = "=0.0.38", path = "crates/hivectl" }

# Third party crates. Versions are bumped by dependabot in groups, and a new one here needs a line
# in the pull request saying why the standard library or an existing one is not enough.
aya = { version = "0.14", default-features = false }
base64 = "0.22"
# Capability tokens that holders can narrow down offline and the gate checks with a public key.
biscuit-auth = { version = "6", default-features = false, features = ["datalog-macro"] }
blake3 = "1.8"
bytes = "1.12"
flate2 = "1.1"
futures = { version = "0.3", default-features = false, features = ["std", "async-await"] }
getrandom = "0.4"
hickory-proto = { version = "0.26", default-features = false, features = ["std"] }
http-body = "1"
http-body-util = "0.1"
hyper = { version = "1", default-features = false }
hyper-util = { version = "0.1", default-features = false }
landlock = "0.4"
libc = "0.2"
libcontainer = { version = "0.7", default-features = false }
md-5 = "0.10"
nix = { version = "0.29", default-features = false }
# The keeper's Raft. 0.9 is the release line on crates.io, and its v1 storage trait keeps the
# log and the state machine in one store.
openraft = { version = "0.9", features = ["serde"] }
prost = "0.14"
prost-types = "0.14"
protox = "0.9"
prost-reflect = { version = "0.16", default-features = false }
# One file, transactions that are durable on commit, and no C code to build.
redb = "2.6"
regex = { version = "1.11", default-features = false, features = ["std", "perf"] }
rustix = { version = "1.1", default-features = false, features = ["std"] }
seccompiler = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = { version = "0.4", default-features = false }
tokio = { version = "1.53", default-features = false }
tokio-util = { version = "0.7", default-features = false }
toml = { version = "1.1", default-features = false }
tonic = { version = "0.14", default-features = false }
tonic-prost = "0.14"
tonic-prost-build = { version = "0.14", default-features = false }
tonic-types = "0.14"
tower = { version = "0.5", default-features = false }
tracing-subscriber = { version = "0.3", default-features = false }
# Runs the wasm cells in the node agent. 36 is wasmtime's long term support line and the newest
# that builds on our MSRV, so dependabot leaves its major version alone.
wasmtime = { version = "36.0.17", default-features = false }
wasmtime-wasi = { version = "36.0.17", default-features = false }

[workspace.lints.rust]
missing_debug_implementations = "warn"
missing_docs = "warn"
rust_2018_idioms = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
# The node agent, the page server, the block device and the guest agent all need unsafe, for
# ioctls, mapped memory and file descriptors passed over sockets. Every block of it carries the
# invariant that makes it sound, and this lint turns that rule into a build failure.
undocumented_unsafe_blocks = "warn"
missing_panics_doc = "warn"
todo = "warn"
dbg_macro = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

# The daemons are profiled far more often than they are shipped, so this profile keeps frame
# pointers and line tables. It is what hivebox-bench builds against.
[profile.profiling]
inherits = "release"
debug = 1
strip = "none"
