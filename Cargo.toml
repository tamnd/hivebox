[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.0.0"
edition = "2024"
# The floor is raised deliberately, in a commit, and the msrv job in CI holds us to it. 1.88 is the
# first release with let chains on edition 2024, and that is the only reason it is not 1.85.
rust-version = "1.88.0"
license = "Apache-2.0"
repository = "https://github.com/tamnd/hivebox"
homepage = "https://github.com/tamnd/hivebox"
authors = ["tamnd <tamnd87@gmail.com>"]
keywords = ["sandbox", "microvm", "firecracker", "reinforcement-learning", "agents"]
categories = ["virtualization", "development-tools", "network-programming"]
readme = "README.md"
# Nothing is published until the public API is worth depending on. The names are checked on
# crates.io before this line goes away, because several hive-* names are already taken there.
publish = false

# One version for the whole workspace, bumped together. Internal crates are pinned exactly so that
# a partial publish can never produce a mixed version build.
[workspace.dependencies]
hive-types = { version = "=0.0.0", path = "crates/hive-types" }
hive-proto = { version = "=0.0.0", path = "crates/hive-proto" }
hive-rt = { version = "=0.0.0", path = "crates/hive-rt" }
hive-telemetry = { version = "=0.0.0", path = "crates/hive-telemetry" }
hive-auth = { version = "=0.0.0", path = "crates/hive-auth" }
hive-cell = { version = "=0.0.0", path = "crates/hive-cell" }
hive-nectar = { version = "=0.0.0", path = "crates/hive-nectar" }
hive-drone = { version = "=0.0.0", path = "crates/hive-drone" }
hive-cell-wasm = { version = "=0.0.0", path = "crates/hive-cell-wasm" }
hive-cell-proc = { version = "=0.0.0", path = "crates/hive-cell-proc" }
hive-cell-oci = { version = "=0.0.0", path = "crates/hive-cell-oci" }
hive-cell-fc = { version = "=0.0.0", path = "crates/hive-cell-fc" }
hive-cell-ch = { version = "=0.0.0", path = "crates/hive-cell-ch" }
hive-cell-qemu = { version = "=0.0.0", path = "crates/hive-cell-qemu" }
hive-cell-plugin = { version = "=0.0.0", path = "crates/hive-cell-plugin" }
hive-uffd = { version = "=0.0.0", path = "crates/hive-uffd" }
hive-snap = { version = "=0.0.0", path = "crates/hive-snap" }
hive-blockd = { version = "=0.0.0", path = "crates/hive-blockd" }
hive-guard = { version = "=0.0.0", path = "crates/hive-guard" }
hive-imaged = { version = "=0.0.0", path = "crates/hive-imaged" }
hive-comb = { version = "=0.0.0", path = "crates/hive-comb" }
hive-waggle = { version = "=0.0.0", path = "crates/hive-waggle" }
hive-scout = { version = "=0.0.0", path = "crates/hive-scout" }
hive-keeper = { version = "=0.0.0", path = "crates/hive-keeper" }
hive-gate = { version = "=0.0.0", path = "crates/hive-gate" }
hive-sdk = { version = "=0.0.0", path = "crates/hive-sdk" }
hive-pollen = { version = "=0.0.0", path = "crates/hive-pollen" }
hive-sim = { version = "=0.0.0", path = "crates/hive-sim" }
hivectl = { version = "=0.0.0", path = "crates/hivectl" }

[workspace.lints.rust]
missing_debug_implementations = "warn"
missing_docs = "warn"
rust_2018_idioms = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
# The node agent, the page server, the block device and the guest agent all need unsafe, for
# ioctls, mapped memory and file descriptors passed over sockets. Every block of it carries the
# invariant that makes it sound, and this lint turns that rule into a build failure.
undocumented_unsafe_blocks = "warn"
missing_panics_doc = "warn"
todo = "warn"
dbg_macro = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

# The daemons are profiled far more often than they are shipped, so this profile keeps frame
# pointers and line tables. It is what hivebox-bench builds against.
[profile.profiling]
inherits = "release"
debug = 1
strip = "none"
