syntax = "proto3";

package hivebox.v1;

import "google/protobuf/duration.proto";
import "hivebox/v1/types.proto";

service Cells {
  // Creates count cells from one spec and streams one event per cell as each is ready or fails.
  rpc Create(CreateRequest) returns (stream CreateEvent);
  rpc Get(GetCellRequest) returns (Cell);
  rpc List(ListCellsRequest) returns (ListCellsResponse);
  // Streams state transitions for the selected cells, starting with their current state.
  rpc Watch(WatchCellsRequest) returns (stream CellEvent);
  rpc Pause(CellSelector) returns (BulkResult);
  rpc Resume(CellSelector) returns (BulkResult);
  rpc Stop(StopRequest) returns (BulkResult);
  // Freezes each cell for good, cuts it off the network and keeps an unscrubbed disk snapshot of
  // it for forensics. A quarantined cell stays paused until it is stopped: it cannot be resumed
  // and no timer stops it.
  rpc Quarantine(QuarantineRequest) returns (QuarantineResponse);
  rpc ExtendTtl(ExtendTtlRequest) returns (Cell);
  rpc UpdatePolicy(UpdatePolicyRequest) returns (Cell);
  rpc ExposePort(ExposePortRequest) returns (PortEndpoint);
}

message Placement {
  // Place near this cell if possible, for example a verifier next to its subject.
  string affinity_cell_id = 1;
  // Spread cells that share these label keys across nodes.
  repeated string spread_labels = 2;
}

message CreateRequest {
  CellSpec spec = 1;
  // One when zero.
  uint32 count = 2;
  // A retry with the same key within 24 hours returns the same cells instead of creating more.
  string idempotency_key = 3;
  Placement placement = 4;
}

message CreateEvent {
  // Which of the count cells this is, from zero.
  uint32 index = 1;
  oneof result {
    Cell cell = 2;
    Error error = 3;
  }
}

message GetCellRequest {
  string id = 1;
}

message ListCellsRequest {
  LabelSelector selector = 1;
  // Only cells in these states. All states when empty.
  repeated CellState states = 2;
  uint32 page_size = 3;
  string page_token = 4;
}

message ListCellsResponse {
  repeated Cell cells = 1;
  string next_page_token = 2;
}

message WatchCellsRequest {
  CellSelector selector = 1;
}

message CellEvent {
  Cell cell = 1;
  CellState from = 2;
}

message StopRequest {
  CellSelector selector = 1;
  // Keep a disk snapshot of each cell before stopping it.
  bool snapshot = 2;
}

message QuarantineRequest {
  CellSelector selector = 1;
  // Why, for the audit log.
  string reason = 2;
}

message QuarantineResponse {
  BulkResult result = 1;
  // One for each cell quarantined.
  repeated QuarantinedCell cells = 2;
}

message QuarantinedCell {
  string cell_id = 1;
  // "cut" when its interface lets nothing through any more, "loopback" when it had only loopback,
  // and "unmanaged" when the node gives cells no network namespace of their own, so nothing could
  // be cut.
  string network = 2;
  // The disk snapshot, empty when there is none, with why in snapshot_error.
  string snapshot_id = 3;
  Error snapshot_error = 4;
}

// Unset fields stay as they were.
message ExtendTtlRequest {
  string id = 1;
  // How long from now until the cell is stopped, whatever it is doing.
  google.protobuf.Duration hard_ttl = 2;
  // The new idle TTL, which starts counting again from now.
  google.protobuf.Duration idle_ttl = 3;
}

message UpdatePolicyRequest {
  string id = 1;
  // Unchanged when empty.
  string network_profile = 2;
  // Unchanged when unset.
  Limits limits = 3;
  // Ends the setup boost now, so the cell drops to its steady CPU quota.
  bool ready = 4;
}

message ExposePortRequest {
  string id = 1;
  uint32 port = 2;
}

message PortEndpoint {
  // A host name routed to the port through the gate.
  string host = 1;
  // A token the gate requires in the Authorization header, scoped to this port.
  string token = 2;
}
