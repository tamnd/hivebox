syntax = "proto3";

package hivebox.v1;

import "hivebox/v1/cells.proto";
import "hivebox/v1/types.proto";

// Disk snapshots of container cells. A snapshot is an image in the node's image store, the cell's
// image plus one layer with what the cell wrote, and its id is the image's id, so any node on the
// same store can start cells from it. Fork copies a cell on its own node. Delete and the other
// kinds are not in yet.
service Snapshots {
  // Freezes the cell while its writes are read, and thaws it after if it was running.
  rpc Snapshot(SnapshotRequest) returns (SnapshotRef);
  // Starts count cells from one snapshot, the same as Cells.Create with the snapshot as source.
  rpc Restore(RestoreRequest) returns (stream CreateEvent);
  // Makes count cells, at most 16, from what a running or paused container cell wrote. Its
  // writable layer is copied while it runs, then the cell is frozen only while the copy is brought
  // up to date, and the children start on its image with the copy, its spec and the labels added.
  // Only the files come along: each child starts processes of its own. A retry with the same key
  // gets the same children back.
  rpc Fork(ForkRequest) returns (stream CreateEvent);
  // Names a scrubbed snapshot, so the project's cells can use the name as their image.
  rpc Commit(CommitRequest) returns (ImageRef);
  rpc Delete(SnapshotRef) returns (Empty);
}

enum SnapshotKind {
  SNAPSHOT_KIND_UNSPECIFIED = 0;
  SNAPSHOT_KIND_DISK = 1;
  SNAPSHOT_KIND_DISK_MEM = 2;
  SNAPSHOT_KIND_PROC = 3;
}

message SnapshotRequest {
  string cell_id = 1;
  // Only disk snapshots for now. Unspecified means disk.
  SnapshotKind kind = 2;
  // Not kept yet, so a request with labels is refused.
  map<string, string> labels = 3;
  // Leaves out histories and credential files and takes passwords out of .git/config, and
  // refuses the snapshot if a key or token is found anywhere else. Only a scrubbed snapshot can
  // be committed.
  bool scrub = 4;
  // Paths, relative to the cell's root, where scrubbing lets keys and tokens stay, like test
  // fixtures.
  repeated string allow = 5;
  // Work trees of git repositories, as absolute paths, each rebuilt before the snapshot with one
  // commit holding what HEAD holds. Other commits, branches, tags, the reflog and stashes are
  // gone, so a testbed cloned from upstream does not carry the fix a task asks for. The cell has
  // to be running and have git.
  repeated string squash_git = 6;
}

message RestoreRequest {
  SnapshotRef snapshot = 1;
  uint32 count = 2;
  // The spec of the new cells. Its source is replaced by the snapshot, and its backend must be
  // the container one.
  CellSpec spec = 3;
  string idempotency_key = 4;
}

message ForkRequest {
  string cell_id = 1;
  uint32 count = 2;
  map<string, string> labels = 3;
  string idempotency_key = 4;
}

message CommitRequest {
  SnapshotRef snapshot = 1;
  // The image name, seen only by the caller's project, where it comes before the node's own
  // images. Committing a name again moves it to the new snapshot.
  string name = 2;
}
