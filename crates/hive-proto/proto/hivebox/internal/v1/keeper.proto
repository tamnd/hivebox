syntax = "proto3";

package hivebox.internal.v1;

// The keeper holds the state that has to agree across the cluster: projects, API keys and the
// nodes with their leases. It is a Raft group of three or five, and any member takes any call.
// A write on a follower is passed to the leader, and a read is answered from the member's own
// copy, which may trail the leader by a heartbeat.
service Keeper {
  rpc CreateProject(CreateProjectRequest) returns (Project);
  rpc ListProjects(ListProjectsRequest) returns (ListProjectsResponse);
  // Makes a key for a project. The key is in the answer and nowhere else, since the keeper
  // keeps only its hash.
  rpc CreateKey(CreateKeyRequest) returns (CreateKeyResponse);
  rpc RevokeKey(RevokeKeyRequest) returns (KeyInfo);
  rpc ListKeys(ListKeysRequest) returns (ListKeysResponse);
  // A comb asks for its node index and epoch when it starts, and again once its lease is lost.
  rpc Register(RegisterRequest) returns (Lease);
  // A comb renews its lease well before it runs out. A lease that ran out cannot be renewed,
  // and the comb has to register again and gets a new epoch. The comb sends the roots of its
  // audit chain along, and a renewal goes through even when the keeper refuses them.
  rpc Renew(RenewRequest) returns (Lease);
  rpc ListNodes(ListNodesRequest) returns (ListNodesResponse);
  // A gate takes a share of a project's quota to spend on its own for a while, and asks again
  // when half of it is spent or it is about to run out. Each call replaces the gate's last
  // share, and asking for nothing gives it back.
  rpc TakeQuota(TakeQuotaRequest) returns (QuotaSlice);
  // Signs a token for the project of a key that is not revoked. The gate sends the hash of the
  // key the caller showed, never the key. The first token makes the keeper's signing key.
  rpc MintToken(MintTokenRequest) returns (MintTokenResponse);
  // Where this member stands in the Raft group.
  rpc Status(StatusRequest) returns (StatusResponse);
  // The roots of a node's audit chain the keeper holds, from this member's copy.
  rpc GetAuditChain(GetAuditChainRequest) returns (AuditChain);
}

message Quota {
  // Most live cells the project may have. 0 is no limit.
  uint64 cells = 1;
  // Most creates a second. 0 is no limit.
  uint32 creates_per_s = 2;
}

message Project {
  string name = 1;
  Quota quota = 2;
  uint64 created_ms = 3;
}

message CreateProjectRequest {
  string name = 1;
  Quota quota = 2;
}

message ListProjectsRequest {}

message ListProjectsResponse {
  repeated Project projects = 1;
}

message KeyInfo {
  // The first 8 characters of the key, to tell keys apart without the key.
  string prefix = 1;
  string project = 2;
  // The BLAKE3 hash of the key, 32 bytes.
  bytes hash = 3;
  uint64 created_ms = 4;
  // 0 while the key works.
  uint64 revoked_ms = 5;
}

message CreateKeyRequest {
  string project = 1;
}

message CreateKeyResponse {
  string key = 1;
  KeyInfo info = 2;
}

message RevokeKeyRequest {
  // The key's hash. Either it or the prefix names the key.
  bytes hash = 1;
  string prefix = 2;
}

message ListKeysRequest {
  // Only this project's keys, or every key when empty.
  string project = 1;
}

message ListKeysResponse {
  repeated KeyInfo keys = 1;
  // The Ed25519 key tokens are checked with, or empty before the first token.
  bytes root_public_key = 2;
}

message MintTokenRequest {
  // The BLAKE3 hash of the API key.
  bytes key_hash = 1;
  // How long the token lasts, at most an hour, and an hour when 0.
  uint64 ttl_ms = 2;
  // Only these cells, or any when empty.
  repeated string cells = 3;
  // Only these calls, or any when empty.
  repeated string ops = 4;
}

message MintTokenResponse {
  string token = 1;
  uint64 expires_ms = 2;
  string project = 3;
}

message RegisterRequest {
  // A name for the machine that stays the same across restarts, like its hostname. A comb that
  // registers under a name it had before gets its old node index back.
  string name = 1;
  // Where gates reach the comb, like http://10.0.0.7:7420.
  string addr = 2;
  // The epoch the comb last ran in, or 0. Within its lease, a comb that restarts keeps its epoch
  // and its cells.
  uint32 epoch = 3;
}

message RenewRequest {
  uint32 node = 1;
  uint32 epoch = 2;
  // The hours of the node's audit chain sealed since the last one the keeper holds, oldest
  // first, at most 64.
  repeated AuditHour audit_hours = 3;
  // How far the node's audit chain has got, or unset for a node that keeps none.
  AuditTip audit_tip = 4;
}

// A sealed hour of a node's audit chain.
message AuditHour {
  // The hour, as its file is named, such as 2026-10-07T06.
  string hour = 1;
  uint64 first_seq = 2;
  uint64 count = 3;
  // The hash its first line points back at, 32 bytes.
  bytes prev = 4;
  // The hash of its last line, 32 bytes.
  bytes root = 5;
}

// How far a node's audit chain has got.
message AuditTip {
  // The hour its last event fell in.
  string hour = 1;
  // How many events the chain holds.
  uint64 seq = 2;
  // The hash of the last event's line, 32 bytes.
  bytes root = 3;
  // When the keeper took it, in milliseconds since the Unix epoch.
  uint64 at_ms = 4;
}

message GetAuditChainRequest {
  // The node's name.
  string node = 1;
}

message AuditChain {
  string node = 1;
  // The sealed hours held, oldest first. The keeper holds the last 720.
  repeated AuditHour hours = 2;
  AuditTip tip = 3;
}

message Lease {
  uint32 node = 1;
  uint32 epoch = 2;
  // When the lease runs out, in milliseconds since the Unix epoch, by the keeper's clock.
  uint64 expires_ms = 3;
  // How long a lease lasts, so the comb can renew without trusting the clocks to agree.
  uint64 ttl_ms = 4;
  // On a renewal, the last sealed hour of the node's audit chain the keeper holds, or empty.
  string audit_hour = 5;
  // On a renewal, why the keeper refused the audit roots sent with it, or empty.
  string audit_refused = 6;
}

message TakeQuotaRequest {
  string project = 1;
  // The gate asking, by a name that stays the same while it runs.
  string gate = 2;
  // How many more cells the gate wants to be able to make.
  uint64 cells = 3;
  // How many creates a second it wants.
  uint32 creates_per_s = 4;
  // The project's live cells as the gate sees them from scout.
  uint64 live = 5;
}

message QuotaSlice {
  // The project's whole quota. Where it is 0 there is no limit, and the share below means
  // nothing.
  Quota quota = 1;
  // How many more cells the gate may make.
  uint64 cells = 2;
  // How many creates a second it may make.
  uint32 creates_per_s = 3;
  // How long the share lasts, after which the keeper hands it to others.
  uint64 ttl_ms = 4;
  // Some gate got less than it asked for, so every gate should ask again soon and give back
  // what it does not need.
  bool contended = 5;
}

message ListNodesRequest {}

message NodeRecord {
  uint32 node = 1;
  string name = 2;
  string addr = 3;
  uint32 epoch = 4;
  uint64 expires_ms = 5;
  // Whether the lease had run out when the member answered.
  bool lost = 6;
}

message ListNodesResponse {
  repeated NodeRecord nodes = 1;
}

message StatusRequest {}

message StatusResponse {
  uint64 id = 1;
  // The leader this member knows of, or 0.
  uint64 leader = 2;
  uint64 term = 3;
  // The index of the last log entry this member applied.
  uint64 applied = 4;
  // The voters, by Raft id.
  repeated uint64 voters = 5;
}

// The Raft messages between keeper members. Each carries one openraft request or answer as
// JSON, since the group does hundreds of writes a second at most and JSON keeps them readable.
service Raft {
  rpc AppendEntries(RaftMessage) returns (RaftMessage);
  rpc Vote(RaftMessage) returns (RaftMessage);
  rpc InstallSnapshot(RaftMessage) returns (RaftMessage);
  // A write a follower took, passed to the leader to put in the log.
  rpc Propose(RaftMessage) returns (RaftMessage);
}

message RaftMessage {
  bytes json = 1;
}
