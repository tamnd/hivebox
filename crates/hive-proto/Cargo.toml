[package]
name = "hive-proto"
description = "Protobuf and gRPC types for the hivebox public API and the internal services."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
blake3.workspace = true
bytes.workspace = true
futures.workspace = true
hive-types.workspace = true
prost.workspace = true
prost-types.workspace = true
tokio = { workspace = true, features = ["io-util", "rt", "sync"] }
tokio-util = { workspace = true, features = ["codec"] }
tonic = { workspace = true, features = ["codegen"] }
tonic-prost.workspace = true
tonic-types.workspace = true

[build-dependencies]
prost.workspace = true
protox.workspace = true
tonic-prost-build.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
