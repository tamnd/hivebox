[package]
name = "hive-nectar"
description = "Image layers, manifests, content addressed storage and the local cache for hivebox."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
blake3.workspace = true
bytes.workspace = true
flate2.workspace = true
futures.workspace = true
http-body-util.workspace = true
hive-blockd.workspace = true
hyper = { workspace = true, features = ["client", "http1"] }
hyper-util = { workspace = true, features = ["client-legacy", "http1", "tokio"] }
libc.workspace = true
rustix = { workspace = true, features = ["fs", "mount", "pipe"] }
serde.workspace = true
serde_json.workspace = true
