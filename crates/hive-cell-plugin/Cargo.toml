[package]
name = "hive-cell-plugin"
description = "The bridge that lets a hivebox isolation backend run as a separate process."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme.workspace = true
publish.workspace = true

[dependencies]
futures.workspace = true
hive-cell.workspace = true
hive-proto.workspace = true
hive-types.workspace = true
hyper-util = { workspace = true, features = ["tokio"] }
prost-types.workspace = true
tokio = { workspace = true, features = ["net"] }
tonic = { workspace = true, features = ["channel", "server"] }
tower = { workspace = true, features = ["util"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "sync", "time"] }

[lints]
workspace = true
