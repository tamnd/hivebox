[package]
name = "hive-comb"
description = "The hivebox node agent that admits, starts, pauses, snapshots and stops cells on one machine."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
blake3.workspace = true
bytes.workspace = true
futures.workspace = true
hive-cell.workspace = true
hive-drone.workspace = true
hive-proto.workspace = true
hive-rt.workspace = true
hive-types.workspace = true
prost.workspace = true
prost-types.workspace = true
serde.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util.workspace = true
toml = { workspace = true, features = ["parse", "serde"] }
tonic = { workspace = true, features = ["server"] }

[target.'cfg(target_os = "linux")'.dependencies]
hive-cell-oci.workspace = true

[dev-dependencies]
hyper-util = { workspace = true, features = ["tokio"] }
tonic = { workspace = true, features = ["channel"] }
tonic-prost.workspace = true
tower = { workspace = true, features = ["util"] }
